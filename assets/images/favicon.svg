<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B3A2D"/>
      <stop offset="100%" style="stop-color:#0F2219"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E0AF52"/>
      <stop offset="100%" style="stop-color:#C9922A"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Coffee cup body -->
  <path d="M15 24 L17 48 Q17.5 52 22 52 L38 52 Q42.5 52 43 48 L45 24 Z" fill="none" stroke="url(#gold)" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Handle -->
  <path d="M45 30 Q55 30 55 38 Q55 46 45 46" fill="none" stroke="url(#gold)" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Saucer -->
  <ellipse cx="30" cy="53" rx="15" ry="2.5" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.5"/>
  <!-- Steam - 3 wisps -->
  <path d="M23 21 Q25 17 23 13" fill="none" stroke="url(#gold)" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
  <path d="M30 19 Q32 15 30 11" fill="none" stroke="url(#gold)" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
  <path d="M37 21 Q39 17 37 13" fill="none" stroke="url(#gold)" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
  <!-- D&B text inside cup -->
  <text x="30" y="43" text-anchor="middle" font-family="Georgia, serif" font-size="9" font-weight="bold" fill="url(#gold)" opacity="0.95">D&amp;B</text>
</svg>
